runner:
  module: paper_replications.example_3
  callable: run
  expected_status: PAPER_REPLICATION_SUCCESS
  required: true
paper:
  main_location: "PDF pages 21-24; Example 3; Table I"
  supplement_location: "PDF pages 13-15; Section 3.3"
model:
  table_goods_sum_tax_rate: 0.010
solver:
  eta_min: 0.2
  eta_max: 3.0
  scan_points: 10000
  root_tolerance: 1.0e-13
  root_deduplication_tolerance: 1.0e-8
paper_rounded_targets:
  eta: [2.071, 0.856, 0.578]
  reduction_percent: [26.21, 31.75, 38.09]
  decimal_tolerance_eta: 0.0005
  decimal_tolerance_reduction: 0.005
